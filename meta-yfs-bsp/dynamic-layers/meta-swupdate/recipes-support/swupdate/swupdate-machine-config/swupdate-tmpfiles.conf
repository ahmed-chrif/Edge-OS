# Create swupdate lib directory and default slot markers on persistent /var if missing
d /var/lib/swupdate 0755 root root -
f /var/lib/swupdate/capsule-complete-slot-0 0644 root root -
f /var/lib/swupdate/capsule-complete-slot-1 0644 root root -
# Ensure systemd extension directories exist on persistent /var
d /var/lib/extensions 0755 root root -
d /var/lib/confexts 0755 root root -
d /run/swupdate 0755 root root -